<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors Game</title>
    <meta name="description" content="Play rock, paper, scissors against the computer, with a running score." />
    <meta property="og:title" content="Rock Paper Scissors" />
    <meta property="og:description" content="Play rock, paper, scissors against the computer, with a running score." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://samarthjaiswal.github.io/Stone-Paper-Scissors/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <main>
      <div class="choices" role="group" aria-label="Choose your move">
        <button type="button" class="choice" id="rock" aria-label="Rock">
          <img src="rock.png" alt="" />
        </button>
        <button type="button" class="choice" id="paper" aria-label="Paper">
          <img src="paper.png" alt="" />
        </button>
        <button type="button" class="choice" id="scissors" aria-label="Scissors">
          <img src="scissors.png" alt="" />
        </button>
      </div>

      <div class="score-board">
        <div class="score">
          <p id="user-score">0</p>
          <p>You</p>
        </div>
        <div class="score">
          <p id="comp-score">0</p>
          <p>Comp</p>
        </div>
      </div>

      <div class="msg-container">
        <p id="msg" aria-live="polite">Play your move</p>
      </div>

      <button type="button" id="reset-btn">Reset score</button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
